const FILLS=[["f1", "Raja Muzaffar mengasaskan Kesultanan Perak pada tahun ________.", "1528", "118"], ["f2", "Sultan Zainal Abidin I mendirikan pusat pemerintahan pertama di ________, Kuala Berang.", "Tanjung Baru", "120"], ["f3", "Pada abad ketujuh, ________ muncul sebagai pusat perdagangan utama di Sarawak.", "Santubong", "178"], ["f4", "Syarif Osman, seorang Ketua Bebas di Sabah, menguasai kawasan ________.", "Marudu", "183"]];
const OPENS=[["l1", "list", "Senaraikan dua jawatan pembesar yang membantu Raja Muhammad mentadbir Pahang.", 2, "116", ["Bendahara", "Penghulu Bendahari", "Temenggung", "Hulubalang Besar"], [["bendahara"], ["penghulu bendahari"], ["temenggung"], ["hulubalang besar"]]], ["l2", "list", "Senaraikan dua tugas wakil raja di Sarawak.", 2, "181", ["Kehakiman/kebajikan/keamanan", "Mengutip cukai penduduk dan perdagangan"], [["kehakiman", "kebajikan", "keamanan"], ["cukai", "perdagangan"]]], ["l3", "list", "Senaraikan dua kegiatan ekonomi masyarakat pedalaman Sabah.", 2, "185", ["Mengutip hasil hutan", "Menanam padi", "Mengutip sarang burung"], [["hasil hutan"], ["padi"], ["sarang burung"]]], ["l4", "list", "Senaraikan dua kaum bumiputera yang terdapat di Sarawak.", 2, "186", ["Iban", "Melayu", "Orang Ulu", "Bidayuh", "Melanau"], [["iban"], ["melayu"], ["orang ulu"], ["bidayuh"], ["melanau"]]], ["l5", "list", "Senaraikan dua fungsi rumah panjang di Sarawak.", 2, "198", ["Tempat tinggal", "Tempat berinteraksi", "Tempat acara/perayaan", "Keselamatan, pertahanan dan kerjasama"], [["tempat tinggal", "tinggal"], ["interaksi", "berinteraksi"], ["perayaan", "acara"], ["keselamatan", "pertahanan", "kerjasama"]]], ["k1", "kbat", "Mengapakah warisan institusi kesultanan perlu dipelihara dalam negara kita?", 3, "132", ["Memelihara identiti dan warisan negara", "Mengukuhkan kestabilan pemerintahan", "Membentuk taat setia, rasa bangga dan hormat"], [["identiti", "warisan"], ["stabil", "pemerintahan"], ["taat", "bangga", "hormat"]]], ["k2", "kbat", "Bagaimanakah masyarakat Sarawak dan Sabah dapat terus memanfaatkan alam sekitar secara bijaksana tanpa merosakkan sumbernya?", 3, "176, 184–185", ["Menggunakan sumber secara terkawal", "Memelihara hutan, sungai dan laut", "Mengamalkan ekonomi lestari dan mengelakkan pencemaran"], [["terkawal", "tidak berlebihan"], ["pelihara", "hutan", "sungai", "laut"], ["lestari", "pencemaran", "mesra alam"]]]];
const MATCH=[{"id": "match1", "title": "Suai Padan 1", "page": "116, 118, 120, 122", "marks": 4, "left": [{"id": "pahang", "text": "Kesultanan Pahang"}, {"id": "perak", "text": "Kesultanan Perak"}, {"id": "terengganu", "text": "Kesultanan Terengganu"}, {"id": "selangor", "text": "Kesultanan Selangor"}], "right": [{"id": "rajamuhammad", "text": "Raja Muhammad"}, {"id": "rajamuzaffar", "text": "Raja Muzaffar"}, {"id": "zainal", "text": "Tun Zainal Abidin"}, {"id": "rajalumu", "text": "Raja Lumu"}], "answer": {"pahang": "rajamuhammad", "perak": "rajamuzaffar", "terengganu": "zainal", "selangor": "rajalumu"}}, {"id": "match2", "title": "Suai Padan 2", "page": "180, 182", "marks": 4, "left": [{"id": "iban", "text": "Iban"}, {"id": "kayan", "text": "Kayan"}, {"id": "kenyah", "text": "Kenyah"}, {"id": "kadazandusun", "text": "Kadazandusun"}], "right": [{"id": "tuairumah", "text": "Tuai Rumah"}, {"id": "kelunan", "text": "Kelunan Maren / Hipun Uma"}, {"id": "peranlepo", "text": "Peran Lepo"}, {"id": "orangtua", "text": "Orang Tua"}], "answer": {"iban": "tuairumah", "kayan": "kelunan", "kenyah": "peranlepo", "kadazandusun": "orangtua"}}];
const A={};let i=0,submitted=false,student="",cls="";
const P=[...MCQ.map(x=>({t:"m",d:x})),...FILLS.map(x=>({t:"f",d:x})),...OPENS.map(x=>({t:x[1],d:x})),...MATCH.map(x=>({t:"match",d:x}))];
const classInput=document.getElementById("classInput"),nameInput=document.getElementById("nameInput");
const esc=s=>String(s??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[m]));
const norm=s=>String(s??"").toLowerCase().replace(/[^a-z0-9\s-]/g," ").replace(/\s+/g," ").trim();
function scoreGroups(t,g,max){let n=norm(t),s=0;g.forEach(a=>{if(a.some(k=>n.includes(norm(k))))s++});return Math.min(s,max)}
function hint(p,extra=""){return `<div class="hint">📘 Panduan: Rujuk Buku Teks Sejarah KSSM Tingkatan 2, <b>m.s. ${p}</b>. ${extra}</div>`}
function initStudents(){const classes=[...new Set(students.map(s=>s.className))].sort();classInput.innerHTML='<option value="">-- Pilih kelas --</option>'+classes.map(c=>`<option>${c}</option>`).join("");classInput.onchange=()=>{const c=classInput.value,list=students.filter(s=>s.className===c).sort((a,b)=>a.name.localeCompare(b.name));nameInput.innerHTML='<option value="">-- Pilih nama murid --</option>'+list.map(s=>`<option>${esc(s.name)}</option>`).join("");nameInput.disabled=!c;}}initStudents();
function render(){let p=P[i];title.textContent=p.t==="m"?"Objektif":p.t==="f"?"Isi Tempat Kosong":p.t==="list"?"Menyenaraikan":p.t==="kbat"?"KBAT":"Suai Padan";if(p.t==="m")rm(p.d);else if(p.t==="f")rf(p.d);else if(p.t==="match")rmatch(p.d);else ro(p.d);prev.disabled=i===0;next.disabled=i===P.length-1}
function rm(q){let [n,text,opts,ans,page]=q,v=A["m"+n]||"";body.innerHTML=`<div class="q"><b>Soalan ${n} • 1 markah</b><p>${text}</p>${hint(page)}<div class="opts">${opts.map((o,j)=>{let L="ABCD"[j],cl=submitted?(L===ans?"correct":v===L&&v!==ans?"wrong":""):"";return `<label class="opt ${cl}"><input type="radio" name="q" value="${L}" ${v===L?"checked":""} ${submitted?"disabled":""}> <b>${L}</b> ${o}</label>`}).join("")}</div>${submitted?`<div class="scheme">Skema: <b>${ans}</b> — ${opts["ABCD".indexOf(ans)]}</div>`:""}</div>`;if(!submitted)body.querySelectorAll('input[type=radio]').forEach(x=>x.onchange=()=>A["m"+n]=x.value)}
function rf(q){let [id,text,ans,page]=q,v=A[id]||"",banks={f1:["1470","1528","1708","1766"],f2:["Pekan","Tanah Abang","Tanjung Baru","Kuala Selangor"],f3:["Santubong","Kalka","Saribas","Melano"],f4:["Marudu","Tungku","Santubong","Samarahan"]},words=banks[id]||[ans];
body.innerHTML=`<div class="q"><b>Isi Tempat Kosong • 1 markah</b><p>${text}</p>${hint(page,"Seret jawapan yang betul ke dalam kotak jawapan.")}<div class="wordbank">${words.map(w=>`<div class="dragword" draggable="${submitted?'false':'true'}" data-word="${esc(w)}">${esc(w)}</div>`).join("")}</div><div id="drop" class="dropzone ${v?'filled':''} ${submitted?(norm(v)===norm(ans)?'correct':'wrong'):''}">${v?esc(v):"Seret jawapan ke sini"}</div>${submitted?`<div class="scheme">Skema: <b>${ans}</b></div>`:""}</div>`;
if(!submitted){body.querySelectorAll('.dragword').forEach(el=>el.addEventListener('dragstart',e=>e.dataTransfer.setData('text/plain',el.dataset.word)));let dz=document.getElementById('drop');dz.addEventListener('dragover',e=>e.preventDefault());dz.addEventListener('drop',e=>{e.preventDefault();let w=e.dataTransfer.getData('text/plain');A[id]=w;dz.textContent=w;dz.classList.add('filled')});body.querySelectorAll('.dragword').forEach(el=>el.onclick=()=>{A[id]=el.dataset.word;dz.textContent=el.dataset.word;dz.classList.add('filled')})}}
function ro(q){let [id,type,text,marks,page,scheme,groups]=q;if(type==="list"){let arr=A[id]||Array(marks).fill("");body.innerHTML=`<div class="q"><b>Menyenaraikan • ${marks} markah</b><p>${text}</p>${hint(page,"Isi satu jawapan dalam setiap kotak.")}<div class="list-grid">${Array.from({length:marks},(_,idx)=>`<div class="list-item"><div class="list-no">${idx+1}</div><input class="list-input" data-idx="${idx}" value="${esc(arr[idx]||"")}" ${submitted?"disabled":""} placeholder="Jawapan ${idx+1}"></div>`).join("")}</div>${submitted?`<div class="scheme"><b>Skema cadangan:</b><ul>${scheme.map(x=>`<li>${x}</li>`).join("")}</ul><b>Markah anggaran: ${scoreGroups(arr.join(" "),groups,marks)}/${marks}</b></div>`:""}</div>`;if(!submitted)body.querySelectorAll('.list-input').forEach(inp=>inp.oninput=()=>{let a=A[id]||Array(marks).fill("");a[Number(inp.dataset.idx)]=inp.value;A[id]=a})}else{let v=A[id]||"";body.innerHTML=`<div class="q"><b>KBAT • ${marks} markah</b><p>${text}</p>${hint(page,"Gunakan format isi + huraian ringkas. Berikan sekurang-kurangnya tiga idea.")}<textarea id="oa" ${submitted?"disabled":""}>${esc(v)}</textarea>${submitted?`<div class="scheme"><b>Skema cadangan:</b><ul>${scheme.map(x=>`<li>${x}</li>`).join("")}</ul><b>Markah anggaran: ${scoreGroups(v,groups,marks)}/${marks}</b></div>`:""}</div>`;if(!submitted)oa.oninput=()=>A[id]=oa.value}}
let selectedLeft=null;
function rmatch(q){if(!A[q.id])A[q.id]={};body.innerHTML=`<div class="q"><b>${q.title} • ${q.marks} markah</b><p>Suai padankan item kiri dengan jawapan kanan.</p>${hint(q.page,"Klik satu kotak kiri, kemudian klik jawapan kanan. Garisan akan dilukis secara automatik.")}<div class="match-wrap" id="matchWrap"><svg class="match-svg" id="matchSvg"></svg><div class="match-col">${q.left.map(x=>`<div class="match-card" data-side="left" data-id="${x.id}">${esc(x.text)}</div>`).join("")}</div><div class="match-col">${q.right.map(x=>`<div class="match-card" data-side="right" data-id="${x.id}">${esc(x.text)}</div>`).join("")}</div></div>${submitted?`<div class="scheme"><b>Skema:</b><ul>${q.left.map(x=>`<li>${esc(x.text)} → ${esc(q.right.find(r=>r.id===q.answer[x.id]).text)}</li>`).join("")}</ul><b>Markah: ${scoreMatch(q)}/${q.marks}</b></div>`:""}</div>`;setupMatch(q)}
function setupMatch(q){selectedLeft=null;let wrap=document.getElementById('matchWrap'),svg=document.getElementById('matchSvg');function draw(){svg.innerHTML='';let wb=wrap.getBoundingClientRect();wrap.querySelectorAll('.paired').forEach(x=>x.classList.remove('paired'));Object.entries(A[q.id]||{}).forEach(([lid,rid])=>{let l=wrap.querySelector(`[data-side="left"][data-id="${lid}"]`),r=wrap.querySelector(`[data-side="right"][data-id="${rid}"]`);if(!l||!r)return;l.classList.add('paired');r.classList.add('paired');let lb=l.getBoundingClientRect(),rb=r.getBoundingClientRect(),line=document.createElementNS('http://www.w3.org/2000/svg','line');line.setAttribute('x1',lb.right-wb.left);line.setAttribute('y1',lb.top+lb.height/2-wb.top);line.setAttribute('x2',rb.left-wb.left);line.setAttribute('y2',rb.top+rb.height/2-wb.top);line.setAttribute('stroke','#7c3aed');line.setAttribute('stroke-width','3');line.setAttribute('stroke-linecap','round');svg.appendChild(line)})}draw();if(submitted)return;wrap.querySelectorAll('[data-side="left"]').forEach(el=>el.onclick=()=>{wrap.querySelectorAll('.selected').forEach(x=>x.classList.remove('selected'));selectedLeft=el.dataset.id;el.classList.add('selected')});wrap.querySelectorAll('[data-side="right"]').forEach(el=>el.onclick=()=>{if(!selectedLeft)return;Object.keys(A[q.id]).forEach(k=>{if(A[q.id][k]===el.dataset.id)delete A[q.id][k]});A[q.id][selectedLeft]=el.dataset.id;selectedLeft=null;render()})}
function scoreMatch(q){let s=0;Object.entries(q.answer).forEach(([l,r])=>{if((A[q.id]||{})[l]===r)s++});return s}
function grade(){let m=0;MCQ.forEach(q=>{if(A["m"+q[0]]===q[3])m++});let f=0;FILLS.forEach(q=>{if(norm(A[q[0]]||"")===norm(q[2]))f++});let l=0,k=0;OPENS.forEach(q=>{let v=A[q[0]]||"";if(Array.isArray(v))v=v.join(" ");let s=scoreGroups(v,q[6],q[3]);q[1]==="kbat"?k+=s:l+=s});let mt=0;MATCH.forEach(q=>mt+=scoreMatch(q));let total=m+f+l+k+mt;return {m,f,l,k,mt,total,pct:Math.round(total/48*10000)/100}}
async function submitAll(){if(submitted)return;if(!confirm("Hantar jawapan? Selepas dihantar skema akan dipaparkan."))return;submitted=true;let r=grade(),payload={action:"saveBab7Bab10",name:student,className:cls,set:"BAB 7 & BAB 10 KSSM",answers:A,obj:r.m,fill:r.f,list:r.l,kbat:r.k,match:r.mt,total:r.total,max:48,pct:r.pct};try{await fetch(WEB_URL,{method:"POST",mode:"no-cors",headers:{"Content-Type":"application/json"},body:JSON.stringify(payload)})}catch(e){}render();let x=document.createElement("div");x.className="result";x.innerHTML=`<b>Semakan selesai</b><h2>${r.total}/48</h2>Objektif ${r.m}/20 • Isi ${r.f}/4 • Menyenaraikan ${r.l}/10 • KBAT ${r.k}/6 • Suai Padan ${r.mt}/8<br><b>${r.pct.toFixed(2)}%</b>`;body.prepend(x);send.disabled=true}
start.onclick=()=>{student=nameInput.value.trim();cls=classInput.value.trim();if(!student||!cls)return alert("Pilih kelas dan nama.");login.classList.add("hidden");app.classList.remove("hidden");who.textContent=` • ${student} • ${cls}`;render()};prev.onclick=()=>{if(i>0){i--;render()}};next.onclick=()=>{if(i<P.length-1){i++;render()}};send.onclick=submitAll;
</script></body></html>

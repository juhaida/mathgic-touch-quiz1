function esc(s){return String(s??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[m]));}
function norm(s){return String(s??"").toLowerCase().replace(/[^a-z0-9\s-]/g," ").replace(/\s+/g," ").trim();}
function any(t,a){const n=norm(t);return a.some(k=>n.includes(norm(k)));}
function scoreGroups(t,g,max){let s=0;g.forEach(x=>{if(any(t,x))s++;});return Math.min(s,max??g.length);}

function render_q27(){let h='<div class="question"><span class="marks">4 markah</span><h3>27. Tandakan (/) bagi betul dan (X) bagi salah</h3>';q27.forEach((row,i)=>{const key="q27_"+i,v=answers[key]||"";h+=`<div class="match-row"><div>${String.fromCharCode(97+i)}. ${row[0]}</div><select class="answer" data-key="${key}" ${submitted?'disabled':''}><option value="">-- Pilih --</option><option ${v==='/'?'selected':''}>/</option><option ${v==='X'?'selected':''}>X</option></select></div>`});if(submitted)h+=`<div class="scheme"><h3>Skema</h3>${q27.map((r,i)=>`<p>${String.fromCharCode(97+i)}. <b>${r[1]}</b></p>`).join("")}</div>`;h+='</div>';body.innerHTML=h;if(!submitted)body.querySelectorAll('select[data-key]').forEach(x=>x.onchange=()=>answers[x.dataset.key]=x.value);}

function grade(){
 let A=0;mcq.forEach(q=>{if(answers["a"+q.n]===q.ans)A+=2;});
 let B=0;subj.forEach(q=>B+=scoreGroups(answers[q.id]||"",q.groups,q.max??q.marks));
 Object.entries(q23).forEach(([k,v])=>{if(answers["q23_"+k]===v)B++;});
 Object.entries(q24).forEach(([cat,vals])=>{for(let i=0;i<3;i++){const a=norm(answers[`q24_${cat}_${i}`]||"");if(vals.some(v=>a.includes(norm(v))))B++;}});
 const items=["Manik","Kain kapas","Gula","Minyak wangi","Tembikar 1","Payung","Batu akik","Barangan kaca","Tembikar 2","Gendang","Batu karnelian","Pinggan mangkuk","Sutera","Tembikar 3"];
 const expected25={"Manik":"Pedagang China","Kain kapas":"Pedagang India","Gula":"Pedagang China","Minyak wangi":"Pedagang Parsi","Tembikar 1":"Pedagang China","Payung":"Pedagang China","Batu akik":"Pedagang India","Barangan kaca":"Pedagang Parsi","Tembikar 2":"Pedagang India","Gendang":"Pedagang Parsi","Batu karnelian":"Pedagang India","Pinggan mangkuk":"Pedagang China","Sutera":"Pedagang China","Tembikar 3":"Pedagang Parsi"};
 items.forEach(it=>{if(answers["q25_"+it]===expected25[it])B++;});
 Object.entries(q26).forEach(([k,v])=>{if(answers["q26_"+k]===v)B++;});
 q27.forEach((r,i)=>{if(answers["q27_"+i]===r[1])B++;});
 return {A,B,total:A+B,pct:Math.round((A+B)*100)/100};
}

async function postResult(r){const payload={action:"savePPT2",name:currentName,className:currentClass,set:"PPT2 SEJARAH T2",answers:answers,A:r.A,B:r.B,total:r.total,max:100,pct:r.pct};try{await fetch(WEB_URL,{method:"POST",mode:"no-cors",headers:{"Content-Type":"application/json"},body:JSON.stringify(payload)});}catch(e){}}
function jsonp(url){return new Promise((resolve,reject)=>{const cb="ppt2_"+Date.now()+"_"+Math.floor(Math.random()*9999),s=document.createElement("script");const t=setTimeout(()=>{delete window[cb];s.remove();reject(new Error("Ranking mengambil masa terlalu lama."));},12000);window[cb]=d=>{clearTimeout(t);delete window[cb];s.remove();resolve(d)};s.onerror=()=>{clearTimeout(t);delete window[cb];s.remove();reject(new Error("Ranking gagal dimuatkan."));};s.src=url+(url.includes("?")?"&":"?")+"callback="+cb;document.body.appendChild(s);});}
async function loadRanking(){const holder=document.createElement("div");holder.className="rank-card";holder.innerHTML="Memuatkan ranking gabungan...";body.prepend(holder);try{await new Promise(r=>setTimeout(r,1200));const data=await jsonp(WEB_URL+"?mode=combinedRanking&name="+encodeURIComponent(currentName)+"&className="+encodeURIComponent(currentClass));let h='<h3>🏆 Ranking Gabungan Sejarah Tingkatan 2</h3><p style="font-size:12px;color:#667085">Ranking berdasarkan <b>peratus gabungan semua set/soalan</b> yang direkodkan dalam Google Sheet LATIHAN SEJARAH.</p><table class="rank-table"><thead><tr><th>#</th><th>Nama</th><th>Kelas</th><th>Set Siap</th><th>Peratus Gabungan</th></tr></thead><tbody>';(data.rows||[]).slice(0,50).forEach(r=>{const mine=r.name.toUpperCase()===currentName.toUpperCase()&&r.className.toUpperCase()===currentClass.toUpperCase();h+=`<tr class="${mine?'me':''}"><td>${r.rank}</td><td>${esc(r.name)}</td><td>${esc(r.className)}</td><td>${r.setCount}</td><td><b>${Number(r.combinedPct).toFixed(2)}%</b></td></tr>`});holder.innerHTML=h+'</tbody></table>'}catch(e){holder.innerHTML='<h3>Ranking</h3>'+esc(e.message)}}
async function submitAll(){if(submitted)return;if(!confirm("Hantar jawapan untuk semakan?"))return;submitted=true;const r=grade();await postResult(r);render();const box=document.createElement("div");box.className="result";box.innerHTML=`<b>Semakan selesai</b><div class="big">${r.total} / 100</div><div>Bahagian A: ${r.A}/40 • Bahagian B: ${r.B}/60</div><p>Peratus kertas ini: <b>${r.pct.toFixed(2)}%</b></p><p>Gunakan Sebelum / Seterusnya untuk melihat skema.</p>`;body.prepend(box);submitBtn.disabled=true;await loadRanking();}
startBtn.onclick=()=>{currentClass=classInput.value;currentName=nameInput.value;if(!currentClass)return alert("Pilih kelas.");if(!currentName)return alert("Pilih nama.");login.classList.add("hidden");app.classList.remove("hidden");studentPill.textContent=currentName;classPill.textContent=currentClass;render();};
prevBtn.onclick=()=>{if(current>0){current--;render();}};nextBtn.onclick=()=>{if(current<pages.length-1){current++;render();}};submitBtn.onclick=submitAll;init();
</script></body></html>

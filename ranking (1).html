<!doctype html><html lang="ms"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Ranking Sejarah Tingkatan 2</title><style>
:root{font-family:system-ui,'Segoe UI',Arial,sans-serif;color:#183044;background:#f2f6fa;font-size:16px}*{box-sizing:border-box}body{margin:0}header{background:linear-gradient(130deg,#092c50,#137d87);color:white;padding:30px 0 20px}.shell{max-width:940px;padding:0 18px;margin:auto}.eyebrow{font-size:.8rem;letter-spacing:3px;color:#adf2e9;font-weight:800}h1{font-size:clamp(1.7rem,5vw,2.8rem);margin:9px 0}header p{opacity:.93}nav{display:flex;gap:16px;margin-top:20px}nav a{color:white;font-weight:700;text-decoration:none;border-bottom:2px solid #a5ffff;padding-bottom:6px}main{padding-top:25px;padding-bottom:70px}h2{color:#105776;margin:30px 0 15px}h3{margin:0 0 10px;color:#185d74}.panel,.question{background:#fff;border:1px solid #d7e4ee;border-radius:16px;padding:22px;margin-bottom:16px;box-shadow:0 4px 16px #163e5610}.compact{padding:18px}.question p{white-space:pre-line;line-height:1.65;margin:4px 0 16px}label{display:block;margin:12px 0;font-weight:600}input[type=text],input:not([type]),textarea,select{display:block;width:100%;max-width:700px;background:white;border:1px solid #b4c9d6;border-radius:9px;padding:12px;font-size:16px;color:#123}input:focus,textarea:focus,select:focus{outline:2px solid #178b9a}textarea{min-height:110px}button{background:#0c6d7b;border:0;border-radius:10px;padding:13px 24px;color:white;font-size:16px;font-weight:700;cursor:pointer;margin:10px 0}button:disabled{opacity:.6;cursor:not-allowed}.options{display:grid;gap:9px}.options label{display:flex;align-items:flex-start;gap:10px;background:#f6f9fc;border:1px solid #d9e5ee;border-radius:10px;padding:10px;margin:0;font-weight:500;line-height:1.5}.options input{margin-top:4px;flex-shrink:0}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:10px}.subtle{font-size:.92rem;color:#5a7280}.msg{font-weight:700;white-space:pre-wrap}.check{display:flex;align-items:center;gap:12px}.chip{display:inline-block;background:#e6f3f3;padding:5px 10px;border-radius:99px;color:#09575d;font-weight:700}.table-wrap{overflow:auto}table{border-collapse:collapse;width:100%;background:white}th,td{border-bottom:1px solid #d9e5ed;padding:13px 10px;text-align:left}th{background:#e4f2f4}td.numeric{text-align:center;font-variant-numeric:tabular-nums}@media(max-width:560px){.panel,.question{padding:14px}header{padding:20px 0}table{font-size:13px}th,td{padding:9px 6px}}

/* Navigasi seperti buku: tepat satu soalan dipaparkan */
[hidden]{display:none!important}.book-page{min-height:410px}.book-page .question{min-height:380px;border-left:6px solid #126985;padding:28px}.book-nav{display:flex;align-items:center;justify-content:space-between;gap:12px;position:sticky;bottom:0;z-index:3;box-shadow:0 -5px 20px #2343}.book-nav button{margin:0}.book-nav span{white-space:nowrap;font-weight:800}.bar{height:9px;background:#dfeaf1;border-radius:9px;overflow:hidden;margin-top:10px}#barFill{height:100%;background:#128a92;transition:width .2s}.answer-line{padding:8px;border-bottom:1px solid #ddd}@media(max-width:550px){.book-page .question{padding:17px;min-height:360px}.book-nav{padding:8px}.book-nav button{padding:12px;font-size:14px}}

</style></head><body><header><div class="shell"><div class="eyebrow">PAPARAN KEPUTUSAN</div><h1>RANKING SEJARAH TINGKATAN 2</h1><p>Markah disahkan guru sahaja · Jumlah 100</p><nav><a href="soalan.html">Jawab soalan</a><a href="ranking.html">Ranking</a></nav></div></header><main class="shell"><div class="panel"><label>Tapis kelas<select id="kelas"><option value="">Semua kelas</option></select></label><button id="refresh">Muat semula ranking</button><p id="notice" class="msg">Sedang memuatkan...</p></div><div class="panel table-wrap"><table><thead><tr><th>Kedudukan</th><th>Nama</th><th>Kelas</th><th>Markah</th><th>Peratus</th></tr></thead><tbody id="rows"></tbody></table></div><p class="subtle">Hanya keputusan dengan semakan lengkap dipaparkan. Pelajar yang belum disemak tidak dimasukkan ke ranking.</p></main><script>
// URL Web App Google Apps Script untuk LATIHAN SEJARAH.
const API_URL = 'https://script.google.com/macros/s/AKfycbzoR87A_4gII01KVA5swEY8KgXLWCmh9zoSsaCX2QNtrg9fA11G_mVwnn8tPFxd7W6K2w/exec';
</script><script>
let all=[];function jsonp(){return new Promise((resolve,reject)=>{if(!/^https:\/\/script\.google\.com\/macros\/s\/.+\/exec$/.test(API_URL))return reject(new Error('Sila tetapkan URL Apps Script dalam config.js'));const cb='ranking_'+Date.now(),url=new URL(API_URL),s=document.createElement('script');url.searchParams.set('action','ranking');url.searchParams.set('callback',cb);let timer=setTimeout(()=>done(new Error('Sambungan tamat masa')),20000);function done(err,data){clearTimeout(timer);s.remove();delete window[cb];err?reject(err):resolve(data)}window[cb]=(v)=>v.ok?done(null,v):done(new Error(v.error));s.onerror=()=>done(new Error('Gagal memuatkan ranking'));s.src=url;document.body.appendChild(s)})}
function render(){const kelas=document.getElementById('kelas').value;const rows=all.filter(x=>!kelas||x.className===kelas).sort((a,b)=>b.total-a.total||a.name.localeCompare(b.name));const tbody=document.getElementById('rows');tbody.replaceChildren();let last=-1,rank=0;rows.forEach((x,i)=>{if(x.total!==last){rank=i+1;last=x.total}const tr=document.createElement('tr');[String(rank),x.name,x.className,String(x.total)+'/100',String(x.total)+'%'].forEach((v,j)=>{const cell=document.createElement('td');cell.textContent=v;if(j>2)cell.className='numeric';tr.appendChild(cell)});tbody.appendChild(tr)});document.getElementById('notice').textContent=rows.length?`${rows.length} keputusan telah disahkan.`:'Tiada keputusan yang telah disahkan untuk pilihan ini.'}
async function refresh(){try{document.getElementById('notice').textContent='Sedang memuatkan...';let response=await jsonp();all=response.rows;const select=document.getElementById('kelas'),current=select.value;select.replaceChildren();let opt=document.createElement('option');opt.value='';opt.textContent='Semua kelas';select.appendChild(opt);[...new Set(all.map(x=>x.className))].sort().forEach(v=>{let o=document.createElement('option');o.value=v;o.textContent=v;select.appendChild(o)});select.value=current;render()}catch(err){document.getElementById('notice').textContent=err.message}}
document.getElementById('kelas').onchange=render;document.getElementById('refresh').onclick=refresh;refresh();
</script></body></html>

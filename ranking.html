<!doctype html><html lang="ms"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Ranking Sejarah Tingkatan 2</title><link rel="stylesheet" href="style.css"></head><body><header><div class="shell"><div class="eyebrow">PAPARAN KEPUTUSAN</div><h1>RANKING SEJARAH TINGKATAN 2</h1><p>Markah disahkan guru sahaja · Jumlah 100</p><nav><a href="index.html">Jawab soalan</a><a href="ranking.html">Ranking</a></nav></div></header><main class="shell"><div class="panel"><label>Tapis kelas<select id="kelas"><option value="">Semua kelas</option></select></label><button id="refresh">Muat semula ranking</button><p id="notice" class="msg">Sedang memuatkan...</p></div><div class="panel table-wrap"><table><thead><tr><th>Kedudukan</th><th>Nama</th><th>Kelas</th><th>Markah</th><th>Peratus</th></tr></thead><tbody id="rows"></tbody></table></div><p class="subtle">Hanya keputusan dengan semakan lengkap dipaparkan. Pelajar yang belum disemak tidak dimasukkan ke ranking.</p></main><script src="config.js"></script><script>
let all=[];function jsonp(){return new Promise((resolve,reject)=>{if(!/^https:\/\/script\.google\.com\/macros\/s\/.+\/exec$/.test(API_URL))return reject(new Error('Sila tetapkan URL Apps Script dalam config.js'));const cb='ranking_'+Date.now(),url=new URL(API_URL),s=document.createElement('script');url.searchParams.set('action','ranking');url.searchParams.set('callback',cb);let timer=setTimeout(()=>done(new Error('Sambungan tamat masa')),20000);function done(err,data){clearTimeout(timer);s.remove();delete window[cb];err?reject(err):resolve(data)}window[cb]=(v)=>v.ok?done(null,v):done(new Error(v.error));s.onerror=()=>done(new Error('Gagal memuatkan ranking'));s.src=url;document.body.appendChild(s)})}
function render(){const kelas=document.getElementById('kelas').value;const rows=all.filter(x=>!kelas||x.className===kelas).sort((a,b)=>b.total-a.total||a.name.localeCompare(b.name));const tbody=document.getElementById('rows');tbody.replaceChildren();let last=-1,rank=0;rows.forEach((x,i)=>{if(x.total!==last){rank=i+1;last=x.total}const tr=document.createElement('tr');[String(rank),x.name,x.className,String(x.total)+'/100',String(x.total)+'%'].forEach((v,j)=>{const cell=document.createElement('td');cell.textContent=v;if(j>2)cell.className='numeric';tr.appendChild(cell)});tbody.appendChild(tr)});document.getElementById('notice').textContent=rows.length?`${rows.length} keputusan telah disahkan.`:'Tiada keputusan yang telah disahkan untuk pilihan ini.'}
async function refresh(){try{document.getElementById('notice').textContent='Sedang memuatkan...';let response=await jsonp();all=response.rows;const select=document.getElementById('kelas'),current=select.value;select.replaceChildren();let opt=document.createElement('option');opt.value='';opt.textContent='Semua kelas';select.appendChild(opt);[...new Set(all.map(x=>x.className))].sort().forEach(v=>{let o=document.createElement('option');o.value=v;o.textContent=v;select.appendChild(o)});select.value=current;render()}catch(err){document.getElementById('notice').textContent=err.message}}
document.getElementById('kelas').onchange=render;document.getElementById('refresh').onclick=refresh;refresh();
</script></body></html>
